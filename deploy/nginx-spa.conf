# nginx interno de cada frontend. No termina TLS ni conoce el dominio: de eso
# se encarga el nginx de entrada del host (sprinta-web). Aquí solo se sirven
# ficheros y se resuelve el enrutado del lado del cliente.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Los ficheros con hash en el nombre no cambian nunca: cachearlos un año
    # ahorra descargas a un GPV que abre la app varias veces al día con datos
    # móviles.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El service worker y el manifiesto NO se cachean. Un service worker
    # cacheado es una versión vieja que se queda pegada y no hay forma de
    # actualizar sin que el usuario borre datos del navegador.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Enrutado del cliente: cualquier ruta desconocida devuelve el index y deja
    # que React Router decida. Sin esto, recargar en /visitas/xxx daría un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
