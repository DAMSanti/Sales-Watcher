
# --- Sales Watcher (sales-watcher.duckdns.org), mismo host, mismo nginx ---
# Bloque de solo HTTP. Se añade primero y solo: el bloque 443 referencia un
# certificado que aún no existe, y nginx no arranca si le falta un fichero de
# certificado — se llevaría por delante los otros cuatro dominios, porque es un
# único proceso sirviéndolos todos.
server {
    listen 80;
    server_name sales-watcher.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
