
# Sales Watcher, tráfico servido. Se añade DESPUÉS de que certbot emita el
# certificado.
server {
    listen 443 ssl;
    server_name sales-watcher.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/sales-watcher.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sales-watcher.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Resolver de Docker + `set` en cada location, igual que los otros
    # dominios: nginx resuelve el contenedor en CADA petición. Sin esto, si un
    # contenedor de Sales Watcher no está arriba al recargar nginx, nginx entra
    # en crash-loop y tira también sprinta, MesaRPG, F1-master y Steel Titans.
    resolver 127.0.0.11 valid=10s;

    # Un vídeo de evidencia son hasta 25 MB y sube por aquí. El valor por
    # defecto de nginx es 1 MB: sin subirlo, toda grabación fallaría con 413.
    client_max_body_size 32m;

    # ── API ────────────────────────────────────────────────────────────
    location /api/ {
        set $sw_api sales-watcher-api:3900;
        proxy_pass http://$sw_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cache_bypass $http_upgrade;
    }

    # ── Evidencias (MinIO) ─────────────────────────────────────────────
    # La ruta NO se reescribe, y es deliberado. MinIO se direcciona por ruta
    # (`forcePathStyle`), así que la URL pública es /<bucket>/<clave> y el
    # bucket se llama justamente `evidencias`. Además la firma SigV4 cubre la
    # ruta y el host: cualquier reescritura invalidaría la firma y el navegador
    # recibiría un 403 al subir la foto.
    location /evidencias/ {
        set $sw_minio sales-watcher-minio:9000;
        proxy_pass http://$sw_minio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un vídeo de 25 MB no debe quedarse en un buffer intermedio antes de
        # llegar a MinIO.
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # ── Backoffice ─────────────────────────────────────────────────────
    # Se quita el prefijo antes de reenviar: dentro del contenedor los ficheros
    # cuelgan de la raíz. El navegador sí ve /gestion/ en todo momento, porque
    # es la base con la que Vite compiló los enlaces.
    location /gestion/ {
        rewrite ^/gestion/(.*)$ /$1 break;
        set $sw_backoffice sales-watcher-backoffice:80;
        proxy_pass http://$sw_backoffice;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sin la barra final, /gestion se queda sin coincidir con el bloque de
    # arriba y caería en la app de campo.
    location = /gestion {
        return 301 /gestion/;
    }

    # ── App de campo ───────────────────────────────────────────────────
    # En la raíz porque es una PWA: su service worker tiene ámbito `/` y desde
    # un subdirectorio no podría controlar la raíz ni instalarse bien.
    location / {
        set $sw_field sales-watcher-field:80;
        proxy_pass http://$sw_field;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
