# nginx interno del backoffice. No termina TLS ni conoce el dominio.
#
# A diferencia de la app de campo (nginx-spa.conf), los ficheros viven bajo
# /gestion/ porque el proxy inverso no stripea el prefijo y el HTML referencia
# sus assets con rutas absolutas /gestion/assets/....
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /gestion/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Enrutado SPA: cualquier ruta bajo /gestion/ que no sea fichero devuelve
    # el index.html del backoffice para que React Router decida.
    location /gestion/ {
        try_files $uri $uri/ /gestion/index.html;
    }

    # Catch-all: redirige a /gestion/ si alguien llega sin prefijo.
    location / {
        return 301 /gestion/;
    }
}
